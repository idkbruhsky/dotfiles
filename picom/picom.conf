backend = "glx";
vsync = true;
shadow = false;

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 6;

animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.15;
  },
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.15;
  }
);
